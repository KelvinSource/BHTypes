name: Publish to PyPI

# Publishes when a GitHub release is published. PyPI trusts this workflow through
# Trusted Publishing (OpenID Connect), so no API token is stored in the repository.
#
# workflow_dispatch is for publishing a version whose tag already exists, e.g. a tag
# created before this workflow was added. Run it from the default branch; it refuses
# unless pyproject.toml's version has a tag v<version> with identical package files.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags, for the version check
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Check the version matches the tag
        run: |
          version=$(uv version --short)
          if [ "${{ github.event_name }}" = "release" ]; then
            if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
              echo "::error::Release tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${version} (expected v${version})"
              exit 1
            fi
          else
            if ! git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
              echo "::error::No tag v${version}; create a GitHub release instead"
              exit 1
            fi
            if ! git diff --quiet "v${version}" HEAD -- src pyproject.toml README.md LICENSE; then
              echo "::error::Package files differ from tag v${version}; bump the version and create a release"
              exit 1
            fi
          fi

      - name: Tests
        run: |
          uv sync --locked
          uv run pytest

      - name: Build
        run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/bhtypes/
    permissions:
      id-token: write  # Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
